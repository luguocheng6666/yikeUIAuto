;#配置说明：
;#[browserType]为选择浏览器
;#[testserver] 为测试地址
;#[Logsfilepath]为Logs文件目录,必须带后面的\
;#[ScreenshotFilePath]为截图文件目录,必须带后面的\
;#[Driverfilepath]为浏览器驱动文件目录,必须带后面的/


;#[browserType]为选择浏览器
[browserType]
#browserName = Firefox
browserName = Chrome
#browserName = IE

;#[testserver] 为测试地址
[testserver]
url=https://www.ekwing.com


[filepath]
; 注意：本节的路径已全部弃用，不再被代码读取。
; 原来这些 ../xxx/ 依赖运行时 CWD，换个目录启动就会指向错误位置。
; 现统一由 setting.py 的 BASE_DIR（项目根，运行时推导）拼装：
;   LOG_PATH / Screenshot_Path / DATA_PATH / reports_dir / backup_dir
; 驱动目录为 setting.BASE_DIR/tools/，文件名按平台自动补 .exe（Linux 不补）。
; 保留本节仅为兼容旧配置，请勿再依据它排查路径问题。
logsfilepath=..\Logs\
screenshotfilepath=..\Screenshot\
driverpath=../tools/
reportpath=../reports/
datapath=../Data/

[Name]
#测试用例sheet名称

TestCaseSheetName=测试用例

